<div class="py-20 text-slate-600">
    <h2 class="text-3xl py-4 text-center uppercase">news and articles</h2>
    <p class="text-base text-center pb-16">Always upto date with our latest News and Articles</p>
    <div class="container grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mx-auto px-3">
        @for (news of articles; track $index) {
        <div class="flex flex-col group h-full">
            <img src={{news.image}} alt={{news.title}}>
            <div class="p-4 flex flex-col flex-grow gap-3 shadow-md group-hover:shadow-xl transition-shadow">
                <h4 class="text-base font-medium cursor-pointer text-slate-600 hover:text-red-500">{{news.title}}</h4>
                <div class="flex capitalize text-sm text-slate-400">
                    <p class="border-r">posted by <span class="uppercase pr-4 cursor-pointer text-slate-600 font-medium">admin</span></p>
                    <span class="ml-4">march 2018</span>
                </div>
                <p class="text-slate-500 text-sm pt-2">Lorem ipsum dolor sit amet, consectetur de adipisicing elit, sed do eiusmod tempore incididunt ut labore et dolore magna.</p>
            </div>
        </div>
        }
    </div>
</div>
